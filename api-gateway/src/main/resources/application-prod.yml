spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      # Global CORS configuration
      # Architecture Note: CORS is handled at the Gateway level to provide 
      # a single point of truth for browser-based client origin validation.
      globalcors:
        cors-configurations:
          '[/**]':
                        allowedOrigins: 
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://localhost:8080"
            allowCredentials: true
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
            maxAge: 3600
      
      # Route definitions
      # Educational Note:
      # routes define how the Gateway maps an incoming path to a backend service.
      # predicates: identify the request (e.g., path matches /api/users/**).
      # filters: modify the request/response (e.g., request rate limiting).
      routes:
        # User Service
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
        
        # Product Service
        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/products/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 50
        
        # Inventory Service
        - id: inventory-service
          uri: http://inventory-service:8083
          predicates:
            - Path=/api/inventory/**
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
        
        # Cart Service
        - id: cart-service
          uri: http://cart-service:8084
          predicates:
            - Path=/api/cart/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
        
        # Order Service
        - id: order-service
          uri: http://order-service:8085
          predicates:
            - Path=/api/orders/**
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
        
        # Payment Service (admin only)
        - id: payment-service
          uri: http://payment-service:8086
          predicates:
            - Path=/api/payments/**
          filters:
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
        
        # API Docs Routes for Swagger UI
        - id: user-service-docs
          uri: http://user-service:8081
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            - RewritePath=/user-service/v3/api-docs, /v3/api-docs
        
        - id: product-service-docs
          uri: http://product-service:8082
          predicates:
            - Path=/product-service/v3/api-docs
          filters:
            - RewritePath=/product-service/v3/api-docs, /v3/api-docs
        
        - id: inventory-service-docs
          uri: http://inventory-service:8083
          predicates:
            - Path=/inventory-service/v3/api-docs
          filters:
            - RewritePath=/inventory-service/v3/api-docs, /v3/api-docs
        
        - id: cart-service-docs
          uri: http://cart-service:8084
          predicates:
            - Path=/cart-service/v3/api-docs
          filters:
            - RewritePath=/cart-service/v3/api-docs, /v3/api-docs
        
        - id: order-service-docs
          uri: http://order-service:8085
          predicates:
            - Path=/order-service/v3/api-docs
          filters:
            - RewritePath=/order-service/v3/api-docs, /v3/api-docs
        
        - id: payment-service-docs
          uri: http://payment-service:8086
          predicates:
            - Path=/payment-service/v3/api-docs
          filters:
            - RewritePath=/payment-service/v3/api-docs, /v3/api-docs

  # Redis for rate limiting
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms

# Server Configuration
server:
  port: 8080

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      otlp:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics
        step: 1m
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
  prometheus:
    metrics:
      export:
        enabled: false

# Logging
logging:
  level:
    root: INFO
    com.monat.ecommerce: INFO
    org.springframework.cloud.gateway: WARN

# JWT Configuration
jwt:
  secret: MyDedicatedSecretKeyForJWTAuth2026MonatEcommercePlatform
  expiration: 86400000

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Product Service
        url: /product-service/v3/api-docs
      - name: Inventory Service
        url: /inventory-service/v3/api-docs
      - name: Cart Service
        url: /cart-service/v3/api-docs
      - name: Order Service
        url: /order-service/v3/api-docs
      - name: Payment Service
        url: /payment-service/v3/api-docs

