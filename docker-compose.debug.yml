# DEBUG OVERRIDE - Use with: docker compose -f docker-compose.yml -f docker-compose.debug.yml up [service]
#
# This file enables JDWP remote debugging for each microservice.
# Usage examples:
#   Debug single service:
#     docker compose -f docker-compose.yml -f docker-compose.debug.yml up order-service
#   Debug all services:
#     docker compose -f docker-compose.yml -f docker-compose.debug.yml up
#
# IntelliJ IDEA setup:
#   Edit Configurations → Add → Remote JVM Debug
#   Host: localhost, Port: see below
#   -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

services:
  api-gateway:
    ports:
      - "8080:8080"
      - "5005:5005"     # Remote debug port
    environment:
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

  user-service:
    ports:
      - "8081:8081"     # Expose HTTP locally for direct debugging
      - "9081:9081"
      - "5081:5081"     # Remote debug port
    environment:
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8 -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5081

  product-service:
