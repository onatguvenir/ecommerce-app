# Monat E-Commerce Infrastructure & Monitoring
# Removed deprecated version: '3.8' for Compose V2 compatibility

services:
  # ============================================
  # INFRASTRUCTURE SERVICES
  # ============================================
  
  # PostgreSQL - Primary database for User, Order, Inventory, Payment services
  postgres:
    image: postgres:16-alpine
    container_name: monat-postgres
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - monat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - Product catalog database
  mongodb:
    image: mongo:7
    container_name: monat-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - monat-network
    healthcheck:
      # 'ping' komutu replica set init olmadan önce de başarıyla çalışır.
      # 'isWritablePrimary' ise replica set initiate edilmeden false döner
      # ve servisi kalıcı olarak 'unhealthy' yapardı.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # MongoDB Init - Initiates the replica set (Required for MongoDB 7+ with replSet)
  mongodb-init:
    image: mongo:7
    container_name: monat-mongodb-init
    depends_on:
      mongodb:
        # service_healthy: mongod'un tamamen ayağa kalktığını ve 'ping'e
        # cevap verdiğini garantiler. Böylece rs.initiate() çağrısı
        # MongoDB hazır olmadan önce yapılmaz.
        condition: service_healthy
    entrypoint: 
      - "mongosh"
      - "--host"
      - "mongodb"
      - "--eval"
      - |
        while (true) {
          try {
            if (db.runCommand('ping').ok === 1) break;
          } catch (e) {}
          print('Waiting for MongoDB...');
          sleep(2000);
        }
        try {
          rs.initiate({ _id: 'rs0', members: [ { _id: 0, host: 'mongodb:27017' } ] });
          print('Replica set initiated');
        } catch (e) {
          if (e.message.includes('already initialized')) {
            print('Replica set already initialized');
          } else {
            print('Error during initiation: ' + e);
          }
        }
        quit(0);
    networks:
      - monat-network

  # Redis - Caching and cart storage
  redis:
    image: redis:7-alpine
    container_name: monat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monat-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka - Event streaming (KRaft mode, no ZooKeeper)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: monat-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - monat-network
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:29092 1 30 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # AKHQ - Kafka UI
  akhq:
    image: tchiotludo/akhq:latest
    container_name: monat-akhq
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      MICRONAUT_SERVER_PORT: 9000
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            monat-kafka:
              properties:
                bootstrap.servers: "kafka:29092"
    networks:
      - monat-network

  # Debezium Connect - Change Data Capture (CDC)
  debezium-connect:
    image: debezium/connect:2.4
    container_name: monat-debezium-connect
    ports:
      - "8089:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - monat-network

  # RedisInsight - Redis UI
  redisinsight:
    image: redis/redisinsight:latest
    container_name: monat-redisinsight
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      RIPORT: 8001
    networks:
      - monat-network

  # MailDev - SMTP Server for local testing (Web UI: 1080, SMTP: 1025)
  maildev:
    image: maildev/maildev
    container_name: monat-maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - monat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1080/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================
  # SECURITY & QUALITY TOOLS
  # ============================================

  # SonarQube DB - Dedicated DB for SonarQube
  sonar-db:
    image: postgres:16-alpine
    container_name: monat-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - monat-network

  # SonarQube - Code quality and security engine (Port 9005)
  sonarqube:
    image: sonarqube:community
    container_name: monat-sonarqube
    depends_on:
      - sonar-db
    ports:
      - "9005:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - monat-network

  # OpenTelemetry Collector - Unified metrics and traces processor
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: monat-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus exporter
      - "13133:13133" # OTEL health check
    networks:
      - monat-network

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: monat-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monat-network
  # Grafana - Monitoring dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: monat-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monat-network

  # Jaeger - Distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: monat-jaeger
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # Collector HTTP
      - "6831:6831/udp"  # Compact thrift
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - monat-network

  # Skywalking OAP - Backend for Skywalking APM
  skywalking-oap:
    image: apache/skywalking-oap-server:10.0.0
    container_name: monat-skywalking-oap
    restart: unless-stopped
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
      JAVA_OPTS: "-Xms1g -Xmx1g"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monat-network
    deploy:
      resources:
        limits:
          memory: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:12800/graphql > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 150s

  # Skywalking UI - Dashboard for monitoring
  skywalking-ui:
    image: apache/skywalking-ui:10.0.0
    container_name: monat-skywalking-ui
    restart: unless-stopped
    depends_on:
      skywalking-oap:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    networks:
      - monat-network

  # Skywalking Agent Init - Provides the agent jar to services
  skywalking-agent-init:
    image: apache/skywalking-java-agent:9.2.0-java21
    container_name: monat-skywalking-agent-init
    volumes:
      - skywalking_agent:/agent_share
    command: /bin/sh -c "cp -rf /skywalking/agent/. /agent_share/ && mkdir -p /agent_share/logs"
    networks:
      - monat-network

  # ============================================
  # LOGGING STACK (ELK)
  # ============================================
  
  # Elasticsearch - Log storage and search engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: monat-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - monat-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Logstash - Log processing pipeline
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: monat-logstash
    volumes:
      - ./docker/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
      - "12201:12201/udp"
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monat-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Kibana - Log visualization and search UI
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: monat-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monat-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Filebeat - Log shipper for Docker containers
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: monat-filebeat
    user: root
    volumes:
      - ./docker/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    command: filebeat -e -strict.perms=false
    depends_on:
      logstash:
        condition: service_healthy
    networks:
      - monat-network

  # ============================================
  # MICROSERVICES
  # ============================================

  # API Gateway - Single entry point (Port 8080)
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: monat-api-gateway
    depends_on:
      redis:
        condition: service_healthy
      skywalking-agent-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
      - SW_AGENT_NAME=api-gateway
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
      - SW_AGENT_LOGGING_DIR=/skywalking/agent/logs
    volumes:
      - skywalking_agent:/skywalking/agent
    networks:
      - monat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # User Service - User management (Port 8081 HTTP, 9081 gRPC)
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: monat-user-service
    depends_on:
      postgres:
        condition: service_healthy
      skywalking-agent-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
      - "9081:9081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/userdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
      - SW_AGENT_NAME=user-service
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
      - SW_AGENT_LOGGING_DIR=/skywalking/agent/logs
    volumes:
      - skywalking_agent:/skywalking/agent
    networks:
      - monat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Product Service - Product catalog (Port 8082)
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: monat-product-service
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      skywalking-agent-init:
        condition: service_completed_successfully
    ports:
      - "8082:8082"
    # HTTP exposed for local testing
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/productdb?replicaSet=rs0&directConnection=true
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
      - SW_AGENT_NAME=product-service
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
      - SW_AGENT_LOGGING_DIR=/skywalking/agent/logs
    volumes:
      - skywalking_agent:/skywalking/agent
    networks:
      - monat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s

  # Inventory Service - Stock management (Port 8083 HTTP, 9083 gRPC)
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: monat-inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      skywalking-agent-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
      - "9083:9083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/inventorydb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
      - SW_AGENT_NAME=inventory-service
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
      - SW_AGENT_LOGGING_DIR=/skywalking/agent/logs
    volumes:
      - skywalking_agent:/skywalking/agent
    networks:
      - monat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Cart Service - Shopping cart (Port 8084)
  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: monat-cart-service
    depends_on:
      redis:
        condition: service_healthy
      skywalking-agent-init:
        condition: service_completed_successfully
    ports:
      - "8084:8084"
    # HTTP exposed for local testing
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
      - SW_AGENT_NAME=cart-service
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
      - SW_AGENT_LOGGING_DIR=/skywalking/agent/logs
    volumes:
      - skywalking_agent:/skywalking/agent
    networks:
      - monat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Order Service - Order management & Saga orchestrator (Port 8085)
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: monat-order-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      skywalking-agent-init:
        condition: service_completed_successfully
    ports:
      - "8085:8085"
    # HTTP exposed for local testing
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/orderdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - GRPC_CLIENT_USER_SERVICE_ADDRESS=static://user-service:9081
      - GRPC_CLIENT_INVENTORY_SERVICE_ADDRESS=static://inventory-service:9083
      - GRPC_CLIENT_PAYMENT_SERVICE_ADDRESS=static://payment-service:9086
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
      - SW_AGENT_NAME=order-service
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
      - SW_AGENT_LOGGING_DIR=/skywalking/agent/logs
    volumes:
      - skywalking_agent:/skywalking/agent
    networks:
      - monat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s

  # Payment Service - Payment processing (Port 8086 HTTP, 9086 gRPC)
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: monat-payment-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      skywalking-agent-init:
        condition: service_completed_successfully
    ports:
      - "8086:8086"
      - "9086:9086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/paymentdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
      - SW_AGENT_NAME=payment-service
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
      - SW_AGENT_LOGGING_DIR=/skywalking/agent/logs
    volumes:
      - skywalking_agent:/skywalking/agent
    networks:
      - monat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Notification Service - Email/SMS notifications (Port 8087)
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: monat-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      skywalking-agent-init:
        condition: service_completed_successfully
    ports:
      - "8087:8087"
    # HTTP exposed for local testing
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notificationdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_MAIL_HOST=maildev
      - SPRING_MAIL_PORT=1025
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
      - SW_AGENT_NAME=notification-service
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
      - SW_AGENT_LOGGING_DIR=/skywalking/agent/logs
    volumes:
      - skywalking_agent:/skywalking/agent
    networks:
      - monat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  fraud-service:
    build:
      context: .
      dockerfile: fraud-service/Dockerfile
    container_name: monat-fraud-service
    depends_on:
      kafka:
        condition: service_healthy
      skywalking-agent-init:
        condition: service_completed_successfully
    ports:
      - "8098:8098"
    # HTTP exposed for local testing (Uses 8098 to prevent conflict with skywalking-ui 8088)
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_STREAMS_STATE_DIR=/tmp/fraud-service/kafka-streams
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_STREAMS_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
      - SW_AGENT_NAME=fraud-service
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
      - SW_AGENT_LOGGING_DIR=/skywalking/agent/logs
      - SERVER_PORT=8098
    volumes:
      - skywalking_agent:/skywalking/agent
    networks:
      - monat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8098/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s


networks:
  monat-network:
    driver: bridge

