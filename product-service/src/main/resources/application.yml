spring:
  profiles:
    active: dev
  application:
    name: product-service

  graphql:
    graphiql:
      enabled: true

  # Virtual Threads (Project Loom) — JDK 21 + Spring Boot 3.2+
  # Educational Note:
  # Disables Tomcat's traditional thread pool. Every request and I/O operation 
  # (MongoDB, Redis, Elasticsearch) runs on a lightweight virtual thread, 
  # significantly increasing platform scalability.
  threads:
    virtual:
      enabled: true

  data:
    mongodb:
      uri: mongodb://admin:admin@localhost:27017/productdb?authSource=admin
      database: productdb

    elasticsearch:
      repositories:
        enabled: true

    # Redis Cache konfigürasyonu
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  elasticsearch:
    uris: http://localhost:9200

  # Spring Cache: Redis backend kullanır (CacheConfig.java ile yapılandırılır)
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 dakika (ms)

# Server Configuration
server:
  port: 8082
  shutdown: graceful

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,caches
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    circuitbreakers:
      enabled: true
  metrics:
    export:
      otlp:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics
        step: 1m
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: false

# Resilience4j Circuit Breaker configuration
# Educational Note:
# - elasticsearchCB: Protects the application from slow/failing search queries.
# - If failure rate exceeds 50%, the circuit opens, preventing further load 
#   on the failing Elasticsearch cluster and providing fast fallback responses.
resilience4j:
  # ... (rest of the block)
  circuitbreaker:
    instances:
      # Elasticsearch circuit breaker
      elasticsearchCB:
        # CLOSED -> OPEN: 10 çağrıdan %50'si başarısız olursa
        sliding-window-size: 10
        failure-rate-threshold: 50
        # OPEN -> HALF_OPEN: 10 saniye bekle
        wait-duration-in-open-state: 10s
        # HALF_OPEN'da 3 test isteği gönder
        permitted-number-of-calls-in-half-open-state: 3
        # Yavaş çağrı eşiği: 3 saniyeden uzun süren çağrılar "yavaş" sayılır
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        # Hangi exception'lar circuit'i açar
        record-exceptions:
          - java.io.IOException
          - java.net.ConnectException
  timelimiter:
    instances:
      elasticsearchCB:
        timeout-duration: 5s

# Logging
logging:
  level:
    root: INFO
    com.monat.ecommerce: DEBUG
    org.springframework.data.elasticsearch: DEBUG
    io.github.resilience4j: DEBUG
    org.springframework.cache: DEBUG
