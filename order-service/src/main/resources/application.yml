spring:
  profiles:
    active: dev
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'

nplus1:
  enabled: true
  threshold: 5
  log-interval: 1
  error-level: LOG
  ignore-packages:
    - com.google.
    - org.hibernate.
    - org.springframework.

grpc:
  client:
    inventory-service:
      address: static://localhost:9083
      negotiationType: plaintext
    payment-service:
      address: static://localhost:9086
      negotiationType: plaintext
    user-service:
      address: static://localhost:9081
      negotiationType: plaintext

server:
  port: 8085
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      otlp:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics
        step: 1m
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: false

logging:
  level:
    root: INFO
    com.monat.ecommerce: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      paymentService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      inventoryService:
        maxAttempts: 3
        waitDuration: 1000ms
      paymentService:
        maxAttempts: 3
        waitDuration: 1000ms
  bulkhead:
    instances:
      inventory-service:
        maxConcurrentCalls: 50
        maxWaitDuration: 500ms
      payment-service:
        maxConcurrentCalls: 50
        maxWaitDuration: 500ms
      user-service:
        maxConcurrentCalls: 100
        maxWaitDuration: 500ms

application:
  datasource:
    primary:
      url: jdbc:postgresql://localhost:5432/orderdb
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: order-primary-pool
    replica:
      url: jdbc:postgresql://localhost:5432/orderdb
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: order-replica-pool
  saga:
    timeout-minutes: 15
  outbox:
    polling-interval-ms: 5000
    batch-size: 100
  reporting:
    materialized-view-refresh-ms: 300000
