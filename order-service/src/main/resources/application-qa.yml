spring:
  application:
    name: order-service

# N+1 Detection Configuration
nplus1:
  enabled: true
  threshold: 5
  log-interval: 1
  error-level: LOG
  ignore-packages:
    - com.google.
    - org.hibernate.
    - org.springframework.

  # Virtual Threads (Project Loom) — JDK 21 + Spring Boot 3.2+
  # Educational Note:
  # Highly efficient for Saga coordination. Every HTTP request, 
  # @KafkaListener, and gRPC client call runs on a virtual thread.
  threads:
    virtual:
      enabled: true
  
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Reliability settings
      acks: all
      retries: 3
      properties:
        # Ensures exactly-once delivery within a transaction
        enable.idempotence: true
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'

# gRPC Clients
grpc:
  client:
    inventory-service:
      address: static://localhost:9083
      negotiationType: plaintext
    payment-service:
      address: static://localhost:9086
      negotiationType: plaintext
    user-service:
      address: static://localhost:9081
      negotiationType: plaintext

# Server Configuration
server:
  port: 8085
  shutdown: graceful

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      otlp:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics
        step: 1m
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: false

# Logging
logging:
  level:
    root: INFO
    com.monat.ecommerce: DEBUG

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      paymentService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  
  retry:
    instances:
      inventoryService:
        maxAttempts: 3
        waitDuration: 1000ms
      paymentService:
        maxAttempts: 3
        waitDuration: 1000ms
        
  bulkhead:
    instances:
      inventory-service:
        maxConcurrentCalls: 50
        maxWaitDuration: 500ms
      payment-service:
        maxConcurrentCalls: 50
        maxWaitDuration: 500ms
      user-service:
        maxConcurrentCalls: 100
        maxWaitDuration: 500ms


# Application specific
application:
  saga:
    timeout-minutes: 15
  outbox:
    polling-interval-ms: 5000
    batch-size: 100
