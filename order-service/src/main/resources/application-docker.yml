application:
  datasource:
    primary:
      url: jdbc:postgresql://postgres:5432/orderdb
    replica:
      url: jdbc:postgresql://postgres:5432/orderdb
  config:
    cart-service-url: http://cart-service:8084

spring:
  kafka:
    bootstrap-servers: kafka:29092

grpc:
  client:
    inventory-service:
      address: static://inventory-service:9083
      negotiationType: plaintext
    payment-service:
      address: static://payment-service:9086
      negotiationType: plaintext
    user-service:
      address: static://user-service:9081
      negotiationType: plaintext

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - com.monat.ecommerce.common.exception.ResourceNotFoundException
    instances:
      payment-service:
        baseConfig: default
        failureRateThreshold: 60
        waitDurationInOpenState: 30s
      inventory-service:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 5s
      user-service:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
    instances:
      payment-service:
        maxAttempts: 2
        waitDuration: 2s
      inventory-service:
        maxAttempts: 3
        waitDuration: 500ms
      user-service:
        maxAttempts: 3
        waitDuration: 1s
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 10
        maxWaitDuration: 1s
    instances:
      payment-service:
        maxConcurrentCalls: 5
      inventory-service:
        maxConcurrentCalls: 15
      user-service:
        maxConcurrentCalls: 10
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
    instances:
      payment-service:
        timeoutDuration: 15s
      inventory-service:
        timeoutDuration: 5s
      user-service:
        timeoutDuration: 10s

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries
  metrics:
    distribution:
      percentiles-histogram:
        resilience4j.circuitbreaker.calls: true
