spring:
  application:
    name: inventory-service

  # ---------------------------------------------------------------
  # Virtual Threads (Project Loom) — JDK 21 + Spring Boot 3.2+
  # PostgreSQL, Redis ve Kafka I/O işlemleri virtual thread üzerinde
  # koşar; platform thread bloke olmaz, throughput artar.
  threads:
    virtual:
      enabled: true
  
  datasource:
    url: jdbc:postgresql://localhost:5432/inventorydb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour
  
  # ---------------------------------------------------------------
  # RabbitMQ (Spring Batch async data processing)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # Tüketim hızını sınırlar, DB'yi yormamak için concurrency ayarlanır
        concurrency: 5
        max-concurrency: 10
        # Retry behavior (önemsiz geçici ağ hataları için, asıl DLQ aşağıda)
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
  
  # ---------------------------------------------------------------
  # Spring Batch
  batch:
    jdbc:
      # Batch tablolarını DB'de otomatik olarak oluşturur (JobRepository, StepExecution vb)
      initialize-schema: always
    job:
      enabled: false  # Otomatik çalışmasını engeller, API'den manuel tetikleriz
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

# gRPC Server Configuration
grpc:
  server:
    port: 9083

# Server Configuration
server:
  port: 8083
  shutdown: graceful

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Logging
logging:
  level:
    root: INFO
    com.monat.ecommerce: DEBUG


# Application specific
application:
  reservation:
    expiry-minutes: 15
