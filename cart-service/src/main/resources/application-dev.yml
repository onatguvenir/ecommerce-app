spring:
  application:
    name: cart-service

  # Virtual Threads (Project Loom) — JDK 21 + Spring Boot 3.2+
  # Redis I/O and HTTP handlers run on virtual threads, enabling high concurrency
  # with minimal memory overhead compared to platform threads.
  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      time-to-live: 86400s
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  # Redisson — single-node config for local/dev (same host as spring.data.redis)
  # Redisson is used exclusively for distributed cart write locks.
  # It connects independently from the Lettuce connection pool used for cart data.
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://localhost:6379"
          connectionMinimumIdleSize: 2
          connectionPoolSize: 10
          connectTimeout: 3000
          timeout: 2000
          retryAttempts: 2
          retryInterval: 1000

# Server
server:
  port: 8084
  shutdown: graceful

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      otlp:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics
        step: 1m
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: false

# Logging
logging:
  level:
    root: INFO
    com.monat.ecommerce: DEBUG

# Application-specific configuration
application:
  cart:
    # Cart expiry in days (7 days default)
    expiry-days: 7
    # Max items per cart
    max-items: 100
    # Distributed lock settings (Redisson / Redis)
    # wait-time-ms  — max time a request waits to acquire cart lock before failing (CartLockException).
    #                 3s is generous for dev; production should be 1-2s.
    # lease-time-ms — max time a lock is held. Prevents deadlock on process crash.
    #                 10s >> any typical cart operation duration.
    lock:
      wait-time-ms: 3000
      lease-time-ms: 10000
