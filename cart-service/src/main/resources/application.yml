spring:
  application:
    name: cart-service

  # ---------------------------------------------------------------
  # Virtual Threads (Project Loom) — JDK 21 + Spring Boot 3.2+
  # Redis cart operasyonları ve HTTP endpoint handler'ları
  # virtual thread üzerinde çalışır; yüksek eşzamanlılıkta verimli.
  threads:
    virtual:
      enabled: true
  
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

# Server Configuration
server:
  port: 8084
  shutdown: graceful

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Logging
logging:
  level:
    root: INFO
    com.monat.ecommerce: DEBUG


# Application specific
application:
  cart:
    # Cart expiry in days (7 days default)
    expiry-days: 7
    # Max items per cart
    max-items: 100
