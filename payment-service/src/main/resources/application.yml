spring:
  application:
    name: payment-service

  # ---------------------------------------------------------------
  # Virtual Threads (Project Loom) — JDK 21 + Spring Boot 3.2+
  # Ödeme işlemleri, Kafka event gönderimi ve gRPC server
  # handler'larının tümü virtual thread üzerinde çalışır.
  threads:
    virtual:
      enabled: true
  
  datasource:
    url: jdbc:postgresql://localhost:5432/paymentdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

# gRPC Server Configuration
grpc:
  server:
    port: 9086

# Server Configuration
server:
  port: 8086
  shutdown: graceful

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Resilience4j RateLimiter Configuration
resilience4j:
  ratelimiter:
    instances:
      payment-api:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 500ms
        registerHealthIndicator: true

# Logging
logging:
  level:
    root: INFO
    com.monat.ecommerce: DEBUG


# Application specific
application:
  payment:
    # Simulate payment failures for testing (30% failure rate)
    failure-rate: 0.30
    # Simulate processing delay
    processing-delay-ms: 500
  outbox:
    polling-interval-ms: 5000
    batch-size: 100
    max-retry-count: 3
