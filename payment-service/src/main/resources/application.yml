spring:
  profiles:
    active: dev
  application:
    name: payment-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/paymentdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

# N+1 Detection Configuration
nplus1:
  enabled: true
  threshold: 5
  log-interval: 1
  error-level: LOG
  ignore-packages:
    - com.google.
    - org.hibernate.
    - org.springframework.

# gRPC Server Configuration
grpc:
  server:
    port: 9086

# Server Configuration
server:
  port: 8086
  shutdown: graceful

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: false
      otlp:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics
        step: 1m
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0

# Resilience4j RateLimiter Configuration
resilience4j:
  ratelimiter:
    instances:
      payment-api:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 500ms
        registerHealthIndicator: true

# Logging
logging:
  level:
    root: INFO
    com.monat.ecommerce: INFO

# Application specific
application:
  payment:
    failure-rate: 0.30
    processing-delay-ms: 500
  outbox:
    polling-interval-ms: 5000
    batch-size: 100
    max-retry-count: 3
