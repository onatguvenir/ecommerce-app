apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
    spec:
      containers:
        - name: redisinsight
          image: redis/redisinsight:latest
          ports:
            - containerPort: 5540
              name: http
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /
              port: 5540
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  namespace: tools
spec:
  selector:
    app: redisinsight
  type: NodePort
  ports:
    - name: http
      port: 5540
      targetPort: 5540
      nodePort: 30554
