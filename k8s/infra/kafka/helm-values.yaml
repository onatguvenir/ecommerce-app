# Bitnami Kafka chart values — local K8s dev (KRaft mode)
# helm install kafka bitnami/kafka -n infra -f k8s/infra/kafka/helm-values.yaml
replicaCount: 1

kraft:
  enabled: true
  clusterId: "MkU3OEVBNTcwNTJENDM2Qk"

zookeeper:
  enabled: false

listeners:
  client:
    containerPort: 9092
    protocol: PLAINTEXT
    name: CLIENT
  controller:
    name: CONTROLLER
    containerPort: 9093
    protocol: PLAINTEXT
  interbroker:
    containerPort: 9094
    protocol: PLAINTEXT
    name: INTERNAL

service:
  ports:
    client: 9092

extraConfig: |
  auto.create.topics.enable=true
  offsets.topic.replication.factor=1
  transaction.state.log.replication.factor=1
  transaction.state.log.min.isr=1
  group.initial.rebalance.delay.ms=0
  log.retention.hours=72

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 1000m

persistence:
  enabled: true
  size: 2Gi
