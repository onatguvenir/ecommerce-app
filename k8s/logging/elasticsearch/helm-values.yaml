# Elastic official chart values — single-node local dev
# helm repo add elastic https://helm.elastic.co
# helm install elasticsearch elastic/elasticsearch -n logging -f k8s/logging/elasticsearch/helm-values.yaml
replicas: 1
minimumMasterNodes: 1

esJavaOpts: "-Xmx1g -Xms1g"

resources:
  requests:
    cpu: "250m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

esConfig:
  elasticsearch.yml: |
    xpack.security.enabled: false
    xpack.security.http.ssl.enabled: false
    discovery.type: single-node

antiAffinity: "soft"

service:
  type: ClusterIP
  port: 9200

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi

# Disable unneeded replicas
sysctlInitContainer:
  enabled: true
