# Elastic official Kibana chart values — local dev
# helm install kibana elastic/kibana -n logging -f k8s/logging/kibana/helm-values.yaml
elasticsearchHosts: "http://elasticsearch-master.logging.svc.cluster.local:9200"

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

service:
  type: NodePort
  nodePort: 30561

kibanaConfig:
  kibana.yml: |
    server.host: "0.0.0.0"
    elasticsearch.hosts: ["http://elasticsearch-master.logging.svc.cluster.local:9200"]
