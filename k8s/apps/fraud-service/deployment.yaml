apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-service
  template:
    metadata:
      labels:
        app: fraud-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8098"
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka.infra.svc.cluster.local 9092; do sleep 2; done']
          resources:
            limits:
              memory: 16Mi
              cpu: 50m
      containers:
        - name: fraud-service
          image: k3d-monat-registry:5000/monat/fraud-service:latest
          ports:
            - containerPort: 8098
              name: http
          envFrom:
            - configMapRef:
                name: monat-shared-env
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.infra.svc.cluster.local:9092"
            - name: SPRING_KAFKA_STREAMS_BOOTSTRAP_SERVERS
              value: "kafka.infra.svc.cluster.local:9092"
            - name: SERVER_PORT
              value: "8098"
            - name: KAFKA_STREAMS_STATE_DIR
              value: "/tmp/fraud-service/kafka-streams"
          resources:
            requests:
              memory: 384Mi
              cpu: 150m
            limits:
              memory: 768Mi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8098
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8098
            initialDelaySeconds: 90
            periodSeconds: 15
