apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8085"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-postgresql.infra.svc.cluster.local 5432; do sleep 2; done']
          resources:
            limits:
              memory: 16Mi
              cpu: 50m
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka.infra.svc.cluster.local 9092; do sleep 2; done']
          resources:
            limits:
              memory: 16Mi
              cpu: 50m
      containers:
        - name: order-service
          image: k3d-monat-registry:5000/monat/order-service:latest
          ports:
            - containerPort: 8085
              name: http
          envFrom:
            - configMapRef:
                name: monat-shared-env
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-postgresql.infra.svc.cluster.local:5432/orderdb"
            - name: GRPC_CLIENT_USER_SERVICE_ADDRESS
              value: "static://user-service:9081"
            - name: GRPC_CLIENT_INVENTORY_SERVICE_ADDRESS
              value: "static://inventory-service:9083"
            - name: GRPC_CLIENT_PAYMENT_SERVICE_ADDRESS
              value: "static://payment-service:9086"
          resources:
            requests:
              memory: 384Mi
              cpu: 150m
            limits:
              memory: 768Mi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 120
            periodSeconds: 15
