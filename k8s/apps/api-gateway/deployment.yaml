apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis-master.infra.svc.cluster.local 6379; do sleep 2; done']
          resources:
            limits:
              memory: 16Mi
              cpu: 50m
      containers:
        - name: api-gateway
          image: k3d-monat-registry:5000/monat/api-gateway:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: monat-shared-env
          resources:
            requests:
              memory: 384Mi
              cpu: 150m
            limits:
              memory: 768Mi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
