apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8087"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-postgresql.infra.svc.cluster.local 5432; do sleep 2; done']
          resources:
            limits:
              memory: 16Mi
              cpu: 50m
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka.infra.svc.cluster.local 9092; do sleep 2; done']
          resources:
            limits:
              memory: 16Mi
              cpu: 50m
      containers:
        - name: notification-service
          image: k3d-monat-registry:5000/monat/notification-service:latest
          ports:
            - containerPort: 8087
              name: http
          envFrom:
            - configMapRef:
                name: monat-shared-env
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-postgresql.infra.svc.cluster.local:5432/notificationdb"
            - name: SPRING_MAIL_HOST
              value: "maildev.tools.svc.cluster.local"
            - name: SPRING_MAIL_PORT
              value: "1025"
            - name: APPLICATION_NOTIFICATION_SIMULATE_EMAIL
              value: "false"
            - name: APPLICATION_NOTIFICATION_FROM_EMAIL
              value: "m.onat.65@gmail.com"
            - name: APPLICATION_NOTIFICATION_SMS_PROVIDER
              value: "console"
            - name: TEXTBELT_API_KEY
              value: "textbelt_test"
          resources:
            requests:
              memory: 384Mi
              cpu: 150m
            limits:
              memory: 768Mi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 90
            periodSeconds: 15
