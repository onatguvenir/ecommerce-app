apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8084"
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis-master.infra.svc.cluster.local 6379; do sleep 2; done']
          resources:
            limits:
              memory: 16Mi
              cpu: 50m
        - name: wait-for-inventory
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z inventory-service.apps.svc.cluster.local 8083; do sleep 2; done']
          resources:
            limits:
              memory: 16Mi
              cpu: 50m
      containers:
        - name: cart-service
          image: k3d-monat-registry:5000/monat/cart-service:latest
          ports:
            - containerPort: 8084
              name: http
          envFrom:
            - configMapRef:
                name: monat-shared-env
          env:
            - name: GRPC_CLIENT_INVENTORY_SERVICE_ADDRESS
              value: "static://inventory-service:9083"
          resources:
            requests:
              memory: 384Mi
              cpu: 150m
            limits:
              memory: 768Mi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 90
            periodSeconds: 15
