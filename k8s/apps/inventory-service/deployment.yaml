apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8083"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-postgresql.infra.svc.cluster.local 5432; do sleep 2; done']
          resources:
            limits:
              memory: 16Mi
              cpu: 50m
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka.infra.svc.cluster.local 9092; do sleep 2; done']
          resources:
            limits:
              memory: 16Mi
              cpu: 50m
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq.infra.svc.cluster.local 5672; do sleep 2; done']
          resources:
            limits:
              memory: 16Mi
              cpu: 50m
      containers:
        - name: inventory-service
          image: k3d-monat-registry:5000/monat/inventory-service:latest
          ports:
            - containerPort: 8083
              name: http
            - containerPort: 9083
              name: grpc
          envFrom:
            - configMapRef:
                name: monat-shared-env
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-postgresql.infra.svc.cluster.local:5432/inventorydb"
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq.infra.svc.cluster.local"
          resources:
            requests:
              memory: 384Mi
              cpu: 150m
            limits:
              memory: 768Mi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 15
