spring:
  profiles:
    active: dev
  application:
    name: user-service

# N+1 Detection Configuration
nplus1:
  enabled: true
  threshold: 5
  log-interval: 1
  error-level: LOG
  ignore-packages:
    - com.google.
    - org.hibernate.
    - org.springframework.

  # Virtual Threads (Project Loom) — JDK 21 + Spring Boot 3.2+
  # Educational Note:
  # When enabled, Spring Boot uses lightweight virtual threads for HTTP requests, 
  # @Async methods, and I/O. This significantly increases throughput for 
  # I/O-bound operations (DB, Kafka, External APIs) by avoiding thread blocking.
  threads:
    virtual:
      enabled: true
  
  datasource:
    url: jdbc:postgresql://localhost:5432/userdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  

# gRPC Server
grpc:
  server:
    port: 9081

# Server Configuration
server:
  port: 8081
  shutdown: graceful
  compression:
    enabled: true

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      otlp:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics
        step: 1m
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: false

# Application Configuration
application:
  jwt:
    secret: MyDedicatedSecretKeyForJWTAuth2026MonatEcommercePlatform
    expiration: 86400000 # 24 hours

# Logging
logging:
  level:
    root: INFO
    com.monat.ecommerce: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-},%X{spanId:-}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"

# Resilience4j Configuration
# Educational Note:
# - Circuit Breaker: Prevents cascading failures by 'opening' when a service fails.
# - Retry: Automatically retries failed operations (transient errors).
# - Rate Limiter: Protects the service from being overwhelmed by too many requests.
resilience4j:
  circuitbreaker:
    instances:
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
  
  retry:
    instances:
      userService:
        maxAttempts: 3
        waitDuration: 1000ms
  
  bulkhead:
    instances:
      userService:
        maxConcurrentCalls: 10
        
  ratelimiter:
    instances:
      user-api:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 500ms
        registerHealthIndicator: true

    tags-sorter: alpha
    operations-sorter: alpha
