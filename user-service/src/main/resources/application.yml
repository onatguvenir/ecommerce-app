spring:
  application:
    name: user-service

  # ---------------------------------------------------------------
  # Virtual Threads (Project Loom) — JDK 21 + Spring Boot 3.2+
  # Bu ayar true yapıldığında Spring Boot, Tomcat worker thread pool'u
  # yerine JVM tarafından yönetilen "platform thread"e bağlı olmayan
  # hafif virtual thread'leri kullanır. Her HTTP isteği, her @Async
  # metodu ve Tomcat'ın tüm I/O işlemleri virtual thread üzerinde koşar.
  # I/O-bound işlemlerde (DB, HTTP client, Kafka) büyük throughput artışı sağlar.
  threads:
    virtual:
      enabled: true
  
  datasource:
    url: jdbc:postgresql://localhost:5432/userdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ecommerce
          jwk-set-uri: http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs

# gRPC Server
grpc:
  server:
    port: 9081

# Server Configuration
server:
  port: 8081
  shutdown: graceful
  compression:
    enabled: true

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0  # Sample 100% of requests (reduce in production)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Application Configuration
application:
  jwt:
    secret: MySecretKeyForJWTTokenGenerationAndValidation1234567890
    expiration: 86400000 # 24 hours

# Logging
logging:
  level:
    root: INFO
    com.monat.ecommerce: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-},%X{spanId:-}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
  
  retry:
    instances:
      userService:
        maxAttempts: 3
        waitDuration: 1000ms
  
  bulkhead:
    instances:
      userService:
        maxConcurrentCalls: 10
        
  ratelimiter:
    instances:
      user-api:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 500ms
        registerHealthIndicator: true

    tags-sorter: alpha
    operations-sorter: alpha
