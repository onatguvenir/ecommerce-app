server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: fraud-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    streams:
      application-id: fraud-detection-streams-app
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      state-dir: ${KAFKA_STREAMS_STATE_DIR:${java.io.tmpdir}/fraud-service/kafka-streams}
      properties:
        commit.interval.ms: 1000
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.springframework.kafka.support.serializer.JsonSerde

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      otlp:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        kafka.streams.processor.node.metrics.process.latency.avg: true
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics
        step: 1m
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: false

app:
  fraud:
    payment-failed-topic: payment.failed
    user-suspended-topic: user-suspension-events
    window-minutes: 5
    max-failures: 5
