input {
  # Docker container logs via Filebeat
  beats {
    port => 5044
  }

  # Gelf input for direct logging from Spring Boot apps
  gelf {
    port => 12201
  }
}

filter {
  # Parse JSON logs from Spring Boot
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "log"
    }
    
    # Extract common fields
    if [log][timestamp] {
      date {
        match => ["[log][timestamp]", "ISO8601"]
        target => "@timestamp"
      }
    }
    
    mutate {
      add_field => {
        "service_name" => "%{[log][logger_name]}"
        "log_level" => "%{[log][level]}"
      }
    }
  }
  
  # Add container metadata
  if [container][name] {
    mutate {
      add_field => {
        "service" => "%{[container][name]}"
      }
    }
  }
  
  # Parse stack traces
  if [message] =~ /Exception|Error/ {
    mutate {
      add_tag => ["error"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
    
    # Template for better field mapping
    template_name => "microservices"
    template_overwrite => true
  }
  
  # Debug output (optional, comment out in production)
  stdout {
    codec => rubydebug
  }
}
