receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
    override: false

extensions:
  health_check:

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
    metric_expiration: 180s
    resource_to_telemetry_conversion:
      enabled: true
  
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  
  debug:
    verbosity: detailed
  
service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch, resourcedetection]
      exporters: [prometheus, debug]
    traces:
      receivers: [otlp]
      processors: [batch, resourcedetection]
      exporters: [otlp_grpc/jaeger, debug]
